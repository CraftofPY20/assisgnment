<body>
    <script>
        // Request three numbers from the user
let n1 = parseFloat(prompt("Enter first number for product:"));
let n2 = parseFloat(prompt("Enter second number for product:"));
let n3 = parseFloat(prompt("Enter third number for product:"));

// Calculate the product
let product = n1 * n2 * n3;

// Display the result
alert("The product of the three numbers is: " + product);
    </script>
