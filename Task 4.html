<!DOCTYPE html>

</head>
<body>
    <script>
        // Using the Date object
let currentDate = new Date();
document.write("<h3>Date Object Demonstration</h3>");
document.write("Current Date and Time: " + currentDate + "<br>");
document.write("Current Year: " + currentDate.getFullYear() + "<br><br>");

// Using the Math object
document.write("<h3>Math Object Demonstration</h3>");
document.write("Pi Value: " + Math.PI + "<br>");
document.write("Square root of 16: " + Math.sqrt(16) + "<br>");
document.write("Random number between 0 and 100: " + Math.floor(Math.random() * 101) + "<br>");
    </script>
</body>
</html>
